<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F1115">
<title>MoneyAPP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block"
      rel="stylesheet">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<div id="app">
  <!-- top bar -->
  <header id="topbar">
    <button id="backBtn" class="iconbtn hidden" aria-label="Назад"><span class="msrc">arrow_back</span></button>
    <h1 id="topTitle">Дашборд</h1>
    <button id="settingsBtn" class="iconbtn" aria-label="Настройки"><span class="msrc">settings</span></button>
  </header>

  <!-- main content -->
  <main id="content">
    <section id="screen-dashboard" class="screen"></section>
    <section id="screen-operations" class="screen"></section>
    <section id="screen-budget" class="screen"></section>
    <section id="screen-goals" class="screen"></section>
    <section id="screen-analytics" class="screen"></section>
    <section id="screen-settings" class="screen"></section>
    <section id="screen-categories" class="screen"></section>
  </main>

  <!-- FAB -->
  <button id="fab" class="fab" aria-label="Добавить"><span class="msrc">add</span></button>

  <!-- bottom navigation -->
  <nav id="bottomnav">
    <button class="navitem" data-tab="dashboard"><span class="msrc">space_dashboard</span><span class="navlabel">Дашборд</span></button>
    <button class="navitem" data-tab="operations"><span class="msrc">receipt_long</span><span class="navlabel">Операции</span></button>
    <button class="navitem" data-tab="budget"><span class="msrc">account_balance</span><span class="navlabel">Бюджет</span></button>
    <button class="navitem" data-tab="goals"><span class="msrc">flag</span><span class="navlabel">Цели</span></button>
    <button class="navitem" data-tab="analytics"><span class="msrc">insights</span><span class="navlabel">Анализ</span></button>
  </nav>

  <!-- overlay: bottom sheet / dialog -->
  <div id="overlay" class="hidden">
    <div id="sheet" class="sheet"></div>
    <div id="dialog" class="dialog hidden"></div>
  </div>

  <div id="snackbar" class="hidden"></div>

  <!-- stale-JS banner (server-side web version mismatch) -->
  <div id="vbanner" class="hidden"></div>

  <!-- auth overlay: PIN entry / setup / phrase / recovery (E2E v1.11.10) -->
  <div id="auth" class="hidden"></div>
</div>
<script src="crypto.js?v=12"></script>
<script src="logic.js?v=12"></script>
<script src="app.js?v=12"></script>
</body>
</html>
